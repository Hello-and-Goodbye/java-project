# ===== Server =====
server.port=8080

# ===== Datasource (MySQL 8) =====
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/java_project?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=lxy
spring.datasource.password=lxy123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 调试时可打开 SQL 日志
spring.jpa.show-sql=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Redis (Lettuce) =====
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
# 无密码时留空；生产环境请放到环境变量/密钥管理中
spring.data.redis.password=redis
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
# Lettuce 连接池
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000ms

# ===== Web =====
# 无匹配处理器时抛 NoHandlerFoundException，交由全局异常处理返回统一 404
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# ===== JWT =====
# 密钥必须 >= 256bit(32 字节)用于 HS256；生产环境请放到环境变量/密钥管理中，不要硬编码提交
# ⚠️ 网关与本服务必须配置相同 secret，否则无法互验签名
app.jwt.secret=Zm9vYmFyLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1obWFjLXNoYTI1Ni1jaGFuZ2VtZQ==
# access token 有效期(毫秒)：15 分钟
app.jwt.access-expiration=900000
# refresh token 有效期(毫秒)：7 天（滑动窗口）
app.jwt.refresh-expiration=604800000
# refresh token 绝对上限(毫秒)：首次登录起最长 30 天，到点必须重新登录
app.jwt.refresh-max-lifetime=2592000000

# ===== 日志 =====
# 日志根目录；容器部署时用环境变量覆盖挂载到宿主盘
# LOG_HOME 由 logback-spring.xml 读取，默认 ./logs/user-service
# 是否记录访问日志(每请求一条，含耗时与状态码)
app.log.access-log-enabled=true
# 慢请求阈值(毫秒)，超过则访问日志升级为 WARN 便于告警
app.log.slow-request-threshold-ms=1000

# ===== SpringDoc / Swagger =====
# OpenAPI 描述文件地址(供 Apifox 导入): http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
# Swagger UI 页面地址: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
# 接口按方法定义顺序、标签按字母排序
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# 只扫描本项目 controller 包
springdoc.packages-to-scan=org.example.controller
