spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: 94748a86-081b-438d-99a1-b6b77e5da08b # 不加的话，默认使用的是public保留空间
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
  # 可选：从 Nacos 配置中心拉取 user-service.yaml，本地无该配置时不阻断启动
  config:
    import: "optional:nacos:user-service.yaml"
