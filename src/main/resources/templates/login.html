<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            width: 360px;
            background: #fff;
            border-radius: 14px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
        }
        .login-card h1 { font-size: 22px; color: #333; text-align: center; margin-bottom: 6px; }
        .login-card .subtitle { font-size: 13px; color: #999; text-align: center; margin-bottom: 28px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        .field input {
            width: 100%; height: 44px; padding: 0 14px; font-size: 14px;
            border: 1px solid #ddd; border-radius: 8px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
        .btn {
            width: 100%; height: 46px; margin-top: 6px; font-size: 15px; color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 18px; text-align: center; display: none; }
        .msg.error { background: #fdecea; color: #d93025; }
        .msg.ok { background: #e6f4ea; color: #137333; }
        .links { margin-top: 16px; font-size: 13px; text-align: center; }
        .links a { color: #667eea; text-decoration: none; cursor: pointer; }
        .hint { margin-top: 18px; font-size: 12px; color: #bbb; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>欢迎登录</h1>
        <p class="subtitle">JWT 鉴权演示</p>

        <div id="msg" class="msg"></div>

        <form id="loginForm">
            <div class="field">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">登 录</button>
        </form>

        <div class="links">
            没有账号？<a id="registerLink">注册一个</a>
        </div>
        <p class="hint">演示账号：admin / 123456</p>
    </div>

    <script>
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');

        function showMsg(text, ok) {
            msg.textContent = text;
            msg.className = 'msg ' + (ok ? 'ok' : 'error');
            msg.style.display = 'block';
        }

        function creds() {
            return {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(creds())
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    window.location.href = '/home';
                } else {
                    showMsg(data.message || '登录失败', false);
                }
            } catch (err) {
                showMsg('网络错误，请重试', false);
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('registerLink').addEventListener('click', async () => {
            const c = creds();
            if (!c.username || !c.password) {
                showMsg('请先填写用户名和密码再注册', false);
                return;
            }
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(c)
                });
                const data = await res.json();
                showMsg(data.message || (res.ok ? '注册成功，请登录' : '注册失败'), res.ok);
            } catch (err) {
                showMsg('网络错误，请重试', false);
            }
        });
    </script>
</body>
</html>
