server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # 允许用 lb://服务名 做基于注册中心的负载均衡路由
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/**
        # 放行 user-service 的接口文档
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
