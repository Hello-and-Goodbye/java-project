server:
  port: 9000

# JWT：网关做统一验签，密钥必须与 user-service 完全一致，否则无法互验签名。
# 生产环境务必用环境变量注入，不要把真实密钥提交进仓库。
app:
  jwt:
    secret: ${JWT_SECRET:Zm9vYmFyLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1obWFjLXNoYTI1Ni1jaGFuZ2VtZQ==}
    access-expiration: 900000
    refresh-expiration: 604800000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        register-enabled: true # 可加可不加
        namespace: 94748a86-081b-438d-99a1-b6b77e5da08b # 不加的话，默认使用的是public保留空间
    gateway:
      # 允许用 lb://服务名 做基于注册中心的负载均衡路由
      discovery:
        locator:
          enabled: false # 关闭自动路由，自己配置路由，因为自动路由往往不够灵活
      routes: # 定义路由规则，每个id就是一条路由，predicates 判断是否匹配，uri 指定路由目标
        - id: user-service # gateway 内部表示，随便取
          uri: lb://user-service # 不是 url，表示去nacos找名字叫 user-service 的服务，然后负载均衡
          predicates: # 断言，判断请求是否匹配这个路由
            - Path=/api/**
        # 放行 user-service 的接口文档
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
